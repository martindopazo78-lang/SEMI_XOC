<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMI · XOC Proyectos</title>

https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap

<style>
:root{
  --bg:#F6F7F9;
  --card:#FFFFFF;
  --text:#111;
  --muted:#667085;
  --border:#E5E7EB;
  --blue:#2563EB;
  --green:#10B981;
  --orange:#F59E0B;
  --red:#EF4444;
}

*{margin:0; padding:0; box-sizing:border-box;}

body{
  font-family:'Inter', sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* TOPBAR */
.topbar{
  height:52px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.logo{
  font-weight:600;
}

.btn{
  padding:7px 14px;
  border:none;
  border-radius:8px;
  font-size:13px;
  cursor:pointer;
}

.btn-primary{
  background:var(--blue);
  color:white;
}

.btn-secondary{
  background:white;
  border:1px solid var(--border);
}

/* CONTENEDOR */
.container{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

/* CARD */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:16px;
}

/* TABLA */
.table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

.table th{
  font-size:11px;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:2px solid var(--border);
  padding:10px;
  text-align:left;
}

.table td{
  padding:10px;
  border-bottom:1px solid var(--border);
}

/* TAGS */
.tag{
  padding:2px 8px;
  font-size:10px;
  border-radius:6px;
  font-weight:600;
}

.tag.blue{background:#EBF2FF;color:var(--blue);}
.tag.green{background:#ECFDF5;color:var(--green);}
.tag.orange{background:#FFF7ED;color:var(--orange);}
.tag.red{background:#FEE2E2;color:var(--red);}
.tag.gray{background:#F2F4F7;color:var(--muted);}

/* INPUT */
.input{
  padding:8px;
  border:1px solid var(--border);
  border-radius:8px;
  width:100%;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="topbar">
  <div class="logo">SEMI · XOC</div>
  <div>
    <button class="btn btn-primary" onclick="abrirModal()">+ Proyecto</button>
  </div>
</div>

<!-- CONTENIDO -->
<div class="container">

  <div class="card">
    
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <h3>Proyectos</h3>
      <input class="input" id="buscar" placeholder="Buscar..." style="width:250px;" oninput="render()" />
    </div>

    <table class="table">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Estado</th>
          <th>Municipio</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>

  </div>

</div>

<!-- MODAL -->
<div id="modal" style="
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  align-items:center;
  justify-content:center;
">
  <div style="background:white; padding:20px; border-radius:10px; width:350px;">
    
    <h3 style="margin-bottom:10px;">Nuevo proyecto</h3>

    <input class="input" id="cod" placeholder="Código"><br><br>
    <input class="input" id="nom" placeholder="Nombre"><br><br>
    <input class="input" id="mun" placeholder="Municipio"><br><br>

    <select class="input" id="est">
      <option>En curso</option>
      <option>Finalizado</option>
      <option>Parado</option>
    </select><br><br>

    <div style="text-align:right;">
      <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="crearProyecto()">Crear</button>
    </div>

  </div>
</div>

<script>

// BASE DATOS (simulada)
let proyectos = [
  {cod:"XM001", nom:"Fibra BCN", est:"En curso", mun:"Barcelona"},
  {cod:"XM002", nom:"Nodo Girona", est:"Finalizado", mun:"Girona"}
];

// RENDER
function render(){
  const q = document.getElementById("buscar").value.toLowerCase();

  const lista = proyectos.filter(p =>
    p.cod.toLowerCase().includes(q) ||
    p.nom.toLowerCase().includes(q) ||
    p.mun.toLowerCase().includes(q)
  );

  document.getElementById("tabla").innerHTML = lista.map(p=>`
    <tr>
      <td style="font-family:monospace;">${p.cod}</td>
      <td>${p.nom}</td>
      <td>${tagEstado(p.est)}</td>
      <td>${p.mun}</td>
    </tr>
  `).join("");
}

// TAG ESTADO
function tagEstado(est){
  if(est==="En curso") return `<span class="tag blue">En curso</span>`;
  if(est==="Finalizado") return `<span class="tag green">Finalizado</span>`;
  if(est==="Parado") return `<span class="tag red">Parado</span>`;
  return `<span class="tag gray">${est}</span>`;
}

// MODAL
function abrirModal(){
  document.getElementById("modal").style.display="flex";
}

function cerrarModal(){
  document.getElementById("modal").style.display="none";
}

// CREAR PROYECTO
function crearProyecto(){
  const cod = document.getElementById("cod").value;
  const nom = document.getElementById("nom").value;
  const mun = document.getElementById("mun").value;
  const est = document.getElementById("est").value;

  if(!cod || !nom){
    alert("Completa los campos");
    return;
  }

  proyectos.unshift({cod,nom,mun,est});

  cerrarModal();
  render();
}

// INIT
render();

</script>

</body>
</html>
