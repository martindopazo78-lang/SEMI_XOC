<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEMI XOC - Gestión</title>

<style>
body{
  font-family: Arial;
  background:#f4f4f4;
  margin:0;
}

.container{
  padding:20px;
}

.tab{
  background:white;
  padding:15px;
  margin-bottom:20px;
  border-radius:8px;
}

.sec-com{
  margin-top:15px;
  border-top:1px solid #ddd;
  padding-top:10px;
}

.sec-com-list{
  margin-bottom:10px;
}

.sec-com textarea{
  width:100%;
  height:60px;
}

.sec-com button{
  margin-top:5px;
  padding:6px 10px;
}
</style>
</head>

<body>

<div class="container">

  <h2>Encargo activo</h2>

  <div id="tabs"></div>

</div>

<script>
// =========================
// 🔹 DATOS BASE (SIMULACIÓN)
// =========================
let proyActual = {
  id:"p1",
  comentarios:[]
};

let encActual = {
  id:"e1",
  num:"ENC01",
  tipo:"OC"
};

// =========================
// 🔹 CONFIG SECCIONES
// =========================
const SECCIONES = [
  "accesos",
  "permisos",
  "replanteo",
  "oc",
  "tendido",
  "empalmes",
  "eco",
  "docs"
];

// =========================
// 🔹 RENDER TABS
// =========================
function renderTabs(){

  const cont = document.getElementById("tabs");

  cont.innerHTML = SECCIONES.map(sec => `
    <div class="tab">
      <h3>${sec.toUpperCase()}</h3>

      <div class="sec-com-mount" data-sec="${sec}"></div>
    </div>
  `).join("");

  montarTodasSecCom();
}

// =========================
// 🔹 MONTA TODAS LAS SECCIONES
// =========================
function montarTodasSecCom(){

  if(!encActual || !proyActual) return;

  SECCIONES.forEach(sec=>{
    montarSecCom(sec);
  });

  // render seguro después del DOM
  requestAnimationFrame(()=>{
    SECCIONES.forEach(sec=>{
      rSecCom(sec);
    });
  });
}

// =========================
// 🔹 CREA UI DE UNA SECCIÓN
// =========================
function montarSecCom(seccion){

  const mount = document.querySelector(`.sec-com-mount[data-sec="${seccion}"]`);
  if(!mount) return;

  mount.innerHTML = `
    <div class="sec-com">

      <div><b>Comentarios (${seccion})</b> 
      <span id="count-${seccion}">0</span></div>

      <div class="sec-com-list" id="list-${seccion}"></div>

      <textarea id="txt-${seccion}" placeholder="Escribir comentario..."></textarea>

      <button onclick="addSecCom('${seccion}')">Enviar</button>

    </div>
  `;
}

// =========================
// 🔹 RENDER COMENTARIOS
// =========================
function rSecCom(seccion){

  const list = document.getElementById(`list-${seccion}`);
  const count = document.getElementById(`count-${seccion}`);

  if(!list) return;

  const data = (proyActual.comentarios || []).filter(c =>
    c.encargoId === encActual.id &&
    (c.seccion || "") === seccion
  );

  count.textContent = data.length;

  if(!data.length){
    list.innerHTML = "<i>Sin comentarios</i>";
    return;
  }

  list.innerHTML = data.map(c => `
    <div style="background:#eee;padding:6px;border-radius:4px;margin-bottom:6px">
      <b>${c.autor}</b> · ${c.fec}
      <div>${c.txt}</div>
    </div>
  `).join("");
}

// =========================
// 🔹 AÑADIR COMENTARIO
// =========================
function addSecCom(seccion){

  const txtEl = document.getElementById(`txt-${seccion}`);
  const txt = txtEl.value.trim();

  if(!txt) return;

  const comentario = {
    autor:"Martin",
    encargoId: encActual.id,
    encargoNum: encActual.num,
    encargoTipo: encActual.tipo,
    seccion,
    txt,
    fec: new Date().toLocaleString()
  };

  if(!proyActual.comentarios) proyActual.comentarios = [];

  proyActual.comentarios.unshift(comentario);

  txtEl.value = "";

  rSecCom(seccion);
}

// =========================
// 🔹 INICIO
// =========================
renderTabs();

</script>

</body>
</html>
